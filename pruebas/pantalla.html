<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba de interfaz · Examen virtual</title></head>
<body style="margin:0"><iframe id="app" style="width:400px;height:860px;border:0"></iframe>
<script type="module">
  window.addEventListener('unhandledrejection', e => fetch('/resultado', { method: 'POST', body: JSON.stringify({ fin: true, lineas: ['ERROR ' + (e.reason && e.reason.stack || e.reason)], pasan: 0, total: 1 }) }));
  import('./pantalla.js').catch(e => fetch('/resultado', { method: 'POST', body: JSON.stringify({ fin: true, lineas: ['ERROR al cargar: ' + (e.stack || e)], pasan: 0, total: 1 }) }));
</script>
</body></html>
